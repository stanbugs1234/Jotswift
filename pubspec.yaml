name: notely
description: "Jotswift: handwritten notes, planner, calendar and to-do lists with swappable skins."
publish_to: 'none'
version: 0.1.0+6

environment:
  sdk: ^3.13.0

dependencies:
  archive: ^4.5.2
  cloud_firestore: ^6.10.0
  crypto: ^3.0.7
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_storage: ^13.6.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  go_router: ^18.1.0
  google_fonts: ^9.0.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  pdfrx: ^2.6.5
  perfect_freehand: ^2.5.2+1
  purchases_flutter: ^10.16.0
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0
flutter:
  uses-material-design: true

  assets:
    - assets/interface/
    - assets/skins/
    - assets/skins/classic/
    - assets/skins/minimal_dark/
    - assets/skins/pastel/
    - assets/skins/kraft/
    - assets/skins/botanical/
