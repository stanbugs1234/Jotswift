name: notely
description: "Notely: handwritten notes, planner, calendar and to-do lists with swappable skins."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  google_fonts: ^9.0.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/skins/
    - assets/skins/classic/
    - assets/skins/minimal_dark/
    - assets/skins/pastel/
    - assets/skins/kraft/
    - assets/skins/botanical/
